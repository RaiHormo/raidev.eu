<div id="image-popup" class="modal">
	<div id="caption">
		<div>
			<b id="caption-text" style="font-size: 32px;">Caption</b>
			<p id="caption-date">Date</p>
			<div id="caption-tag-container">
				<button class="caption-tags" onclick="window.location.hash = this.textContent;">Tag</button>
			</div>
		</div>
		<div id="popup-actions">
			<button id="download-popup"><i class="fa-solid fa-download"></i></button>
			<button id="fullscreen-popup"><i class="fa-solid fa-expand"></i></button>
			<button id="close-popup"><i class="fa-solid fa-close"></i></button>
		</div>
	</div>
	<img class="modal-content" id="img01">
	<ul id="popup-download-dropdown" hidden>
		<li><button id="download-avif">Download AVIF</button></li>
		<li><button id="download-png">Download PNG</button></li>
		<li><button id="download-newtab">Open in New Tab</button></li>
	</ul>
</div>
